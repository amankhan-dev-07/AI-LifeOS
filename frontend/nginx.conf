# nginx config for the AI-LifeOS frontend.
#
# Two things matter for a client-side-routed SPA behind a proxy:
#   1. unknown paths must return index.html, or a refresh on /app/tasks gives
#      a 404 instead of the app;
#   2. /api must reach the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets under /assets are immutable — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy the API to the backend service. The name matches the service in
    # docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for the AI brain's upstream model call, which can take a
        # while on a small instance.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # index.html must never be cached, or clients keep loading an old bundle
    # that references deleted hashed assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback. Without this, reloading /app or any deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline response headers mirroring the backend's set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
